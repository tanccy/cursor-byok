name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          repository: tanccy/cursor-byok
          ref: feat/portable-data-and-batch-models

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # 必须用 tauri CLI 构建：它会自动启用 tauri/custom-protocol，
      # 裸 cargo build 会编成开发模式，启动后只显示
      # "frontend development server is unavailable"。
      # tauri build 会自动执行 beforeBuildCommand（npm run build）。
      - name: Build desktop exe
        working-directory: apps/desktop
        run: npm run tauri:build -- --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-desktop-windows
          path: target/release/cursor-byok-desktop.exe
